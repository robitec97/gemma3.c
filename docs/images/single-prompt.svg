</text><text class="terminal-4236810348-r3" x="0" y="68.8" textLength="683.2" clip-path="url(#terminal-4236810348-line-2)">gemma3.c&#160;0.2.0&#160;|&#160;metal&#160;|&#160;context&#160;8192&#160;|&#160;loaded&#160;in&#160;5.21&#160;s</text><text class="terminal-4236810348-r2" x="1171.2" y="68.8" textLength="12.2" clip-path="url(#terminal-4236810348-line-2)">
</text><text class="terminal-4236810348-r2" x="0" y="93.2" textLength="1171.2" clip-path="url(#terminal-4236810348-line-3)">Okay,&#160;here’s&#160;a&#160;breakdown&#160;of&#160;why&#160;memory&#160;bandwidth&#160;limits&#160;LLM&#160;token&#160;generation,&#160;explained&#160;in&#160;three</text><text class="terminal-4236810348-r2" x="1171.2" y="93.2" textLength="12.2" clip-path="url(#terminal-4236810348-line-3)">
</text><text class="terminal-4236810348-r2" x="0" y="117.6" textLength="170.8" clip-path="url(#terminal-4236810348-line-4)">bullet&#160;points:</text><text class="terminal-4236810348-r2" x="1171.2" y="117.6" textLength="12.2" clip-path="url(#terminal-4236810348-line-4)">
</text><text class="terminal-4236810348-r2" x="1171.2" y="142" textLength="12.2" clip-path="url(#terminal-4236810348-line-5)">
</text><text class="terminal-4236810348-r2" x="0" y="166.4" textLength="1122.4" clip-path="url(#terminal-4236810348-line-6)">*&#160;&#160;&#160;**Large&#160;Model&#160;Size:**&#160;LLMs&#160;like&#160;GPT-3&#160;have&#160;*billions*&#160;of&#160;parameters,&#160;and&#160;each&#160;parameter&#160;</text><text class="terminal-4236810348-r2" x="1171.2" y="166.4" textLength="12.2" clip-path="url(#terminal-4236810348-line-6)">
</text><text class="terminal-4236810348-r2" x="0" y="190.8" textLength="1171.2" clip-path="url(#terminal-4236810348-line-7)">needs&#160;to&#160;be&#160;loaded&#160;from&#160;memory&#160;during&#160;generation.&#160;This&#160;massive&#160;data&#160;volume&#160;demands&#160;a&#160;huge&#160;amount</text><text class="terminal-4236810348-r2" x="1171.2" y="190.8" textLength="12.2" clip-path="url(#terminal-4236810348-line-7)">
</text><text class="terminal-4236810348-r2" x="0" y="215.2" textLength="158.6" clip-path="url(#terminal-4236810348-line-8)">of&#160;bandwidth.</text><text class="terminal-4236810348-r2" x="1171.2" y="215.2" textLength="12.2" clip-path="url(#terminal-4236810348-line-8)">
</text><text class="terminal-4236810348-r2" x="1171.2" y="239.6" textLength="12.2" clip-path="url(#terminal-4236810348-line-9)">
</text><text class="terminal-4236810348-r2" x="0" y="264" textLength="1110.2" clip-path="url(#terminal-4236810348-line-10)">*&#160;&#160;&#160;**Activation&#160;Storage:**&#160;During&#160;token&#160;generation,&#160;the&#160;model&#160;needs&#160;to&#160;store&#160;intermediate&#160;</text><text class="terminal-4236810348-r2" x="1171.2" y="264" textLength="12.2" clip-path="url(#terminal-4236810348-line-10)">
</text><text class="terminal-4236810348-r2" x="0" y="288.4" textLength="1171.2" clip-path="url(#terminal-4236810348-line-11)">calculations&#160;(activations)&#160;for&#160;each&#160;token.&#160;These&#160;activations&#160;also&#160;consume&#160;significant&#160;memory&#160;and</text><text class="terminal-4236810348-r2" x="1171.2" y="288.4" textLength="12.2" clip-path="url(#terminal-4236810348-line-11)">
</text><text class="terminal-4236810348-r2" x="0" y="312.8" textLength="646.6" clip-path="url(#terminal-4236810348-line-12)">require&#160;rapid&#160;access&#160;–&#160;again,&#160;needing&#160;high&#160;bandwidth.</text><text class="terminal-4236810348-r2" x="1171.2" y="312.8" textLength="12.2" clip-path="url(#terminal-4236810348-line-12)">
</text><text class="terminal-4236810348-r2" x="1171.2" y="337.2" textLength="12.2" clip-path="url(#terminal-4236810348-line-13)">
</text><text class="terminal-4236810348-r2" x="0" y="361.6" textLength="1171.2" clip-path="url(#terminal-4236810348-line-14)">*&#160;&#160;&#160;**Sequential&#160;Access:**&#160;LLMs&#160;generate&#160;tokens&#160;sequentially,&#160;meaning&#160;the&#160;model&#160;repeatedly&#160;needs</text><text class="terminal-4236810348-r2" x="1171.2" y="361.6" textLength="12.2" clip-path="url(#terminal-4236810348-line-14)">
</text><text class="terminal-4236810348-r2" x="0" y="386" textLength="1098" clip-path="url(#terminal-4236810348-line-15)">to&#160;fetch&#160;and&#160;write&#160;data&#160;to&#160;memory.&#160;&#160;This&#160;continuous,&#160;sequential&#160;access&#160;pattern&#160;is&#160;a&#160;major&#160;</text><text class="terminal-4236810348-r2" x="1171.2" y="386" textLength="12.2" clip-path="url(#terminal-4236810348-line-15)">
</text><text class="terminal-4236810348-r2" x="0" y="410.4" textLength="1000.4" clip-path="url(#terminal-4236810348-line-16)">bottleneck&#160;for&#160;memory&#160;bandwidth,&#160;limiting&#160;how&#160;quickly&#160;new&#160;tokens&#160;can&#160;be&#160;produced.&#160;</text><text class="terminal-4236810348-r2" x="1171.2" y="410.4" textLength="12.2" clip-path="url(#terminal-4236810348-line-16)">
</text><text class="terminal-4236810348-r2" x="1171.2" y="434.8" textLength="12.2" clip-path="url(#terminal-4236810348-line-17)">
</text><text class="terminal-4236810348-r2" x="0" y="459.2" textLength="1146.8" clip-path="url(#terminal-4236810348-line-18)">Do&#160;you&#160;want&#160;me&#160;to&#160;elaborate&#160;on&#160;any&#160;of&#160;these&#160;points,&#160;or&#160;perhaps&#160;discuss&#160;potential&#160;solutions&#160;to&#160;</text><text class="terminal-4236810348-r2" x="1171.2" y="459.2" textLength="12.2" clip-path="url(#terminal-4236810348-line-18)">
</text><text class="terminal-4236810348-r2" x="0" y="483.6" textLength="195.2" clip-path="url(#terminal-4236810348-line-19)">this&#160;limitation?</text><text class="terminal-4236810348-r2" x="1171.2" y="483.6" textLength="12.2" clip-path="url(#terminal-4236810348-line-19)">
</text><text class="terminal-4236810348-r2" x="1171.2" y="508" textLength="12.2" clip-path="url(#terminal-4236810348-line-20)">
</text><text class="terminal-4236810348-r3" x="0" y="532.4" textLength="1024.8" clip-path="url(#terminal-4236810348-line-21)">[&#160;prompt&#160;31&#160;tok&#160;@&#160;15.1&#160;tok/s&#160;|&#160;first&#160;token&#160;2.05&#160;s&#160;|&#160;generated&#160;184&#160;tok&#160;@&#160;13.0&#160;tok/s&#160;]</text><text class="terminal-4236810348-r2" x="1171.2" y="532.4" textLength="12.2" clip-path="url(#terminal-4236810348-line-21)">
</text>
